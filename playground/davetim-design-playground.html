<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Davetim Visual Playground</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ui-bg: #0c0d10;
      --ui-panel: #13151a;
      --ui-panel-2: #191c22;
      --ui-line: #292d36;
      --ui-text: #f5f7fb;
      --ui-muted: #979daa;
      --ui-accent: #ff8458;
      --ui-green: #53d69b;
      --ui-amber: #f3bd61;
      --ui-red: #ff7777;
      --primary: #e85d2a;
      --primary-text: #c94318;
      --on-primary: #241824;
      --plum: #3b183a;
      --canvas: #fff8f1;
      --surface: #ffffff;
      --ink: #241824;
      --muted: #6e626c;
      --secondary: #2442a5;
      --secondary-soft: #e8ecff;
      --border: #eadbd1;
      --radius: 24px;
      --density: 1;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--ui-bg); color: var(--ui-text); min-width: 320px; }
    button, input, select { font: inherit; }
    button, select, input[type="range"], input[type="color"] { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100%; }
    .sidebar { background: var(--ui-panel); border-right: 1px solid var(--ui-line); display: flex; flex-direction: column; gap: 22px; padding: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .ui-brand { align-items: center; display: flex; gap: 11px; }
    .ui-brand__mark { align-items: center; background: var(--ui-accent); border-radius: 10px; color: #1a0d08; display: flex; font-size: 12px; font-weight: 900; height: 38px; justify-content: center; transform: rotate(-4deg); width: 46px; }
    .ui-brand strong { display: block; font-size: 15px; }
    .ui-brand span { color: var(--ui-muted); display: block; font-size: 11px; margin-top: 2px; }
    .control-group { border-top: 1px solid var(--ui-line); padding-top: 18px; }
    .control-group h2 { color: var(--ui-muted); font-size: 10px; letter-spacing: 1.4px; margin: 0 0 12px; text-transform: uppercase; }
    .presets { display: grid; gap: 7px; grid-template-columns: repeat(2, 1fr); }
    .preset { background: var(--ui-panel-2); border: 1px solid var(--ui-line); border-radius: 9px; color: var(--ui-text); min-height: 42px; padding: 8px 10px; text-align: left; transition: border-color 150ms ease, transform 150ms ease; }
    .preset:hover { border-color: #555c6b; transform: translateY(-1px); }
    .preset[aria-pressed="true"] { border-color: var(--ui-accent); color: #ffc8b5; }
    .field { display: grid; gap: 7px; margin-top: 13px; }
    .field:first-of-type { margin-top: 0; }
    .field__label { align-items: center; color: #c8ccd5; display: flex; font-size: 12px; justify-content: space-between; }
    .field__value { color: var(--ui-accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    select { appearance: none; background: var(--ui-panel-2); border: 1px solid var(--ui-line); border-radius: 9px; color: var(--ui-text); min-height: 42px; padding: 0 34px 0 11px; width: 100%; }
    .select-wrap { position: relative; }
    .select-wrap::after { color: var(--ui-muted); content: "⌄"; pointer-events: none; position: absolute; right: 12px; top: 9px; }
    input[type="range"] { accent-color: var(--ui-accent); margin: 2px 0; width: 100%; }
    input[type="color"] { background: none; border: 0; height: 34px; padding: 0; width: 100%; }
    .color-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .color-field { background: var(--ui-panel-2); border: 1px solid var(--ui-line); border-radius: 9px; padding: 8px; }
    .color-field span { color: var(--ui-muted); display: block; font-size: 10px; margin-bottom: 6px; }
    .device-row { display: grid; gap: 6px; grid-template-columns: repeat(4, 1fr); }
    .device-button { background: transparent; border: 1px solid var(--ui-line); border-radius: 8px; color: var(--ui-muted); font-size: 10px; min-height: 36px; }
    .device-button:hover, .device-button.is-active { border-color: var(--ui-accent); color: var(--ui-text); }
    .switch-row { align-items: center; display: flex; justify-content: space-between; margin-top: 12px; }
    .switch-row span { color: #c8ccd5; font-size: 12px; }
    .switch { background: #303541; border: 0; border-radius: 999px; height: 24px; padding: 3px; position: relative; width: 43px; }
    .switch::after { background: white; border-radius: 50%; content: ""; display: block; height: 18px; transition: transform 160ms ease; width: 18px; }
    .switch[aria-pressed="true"] { background: var(--ui-accent); }
    .switch[aria-pressed="true"]::after { transform: translateX(19px); }
    .sidebar-actions { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: auto; }
    .ui-button { align-items: center; background: var(--ui-panel-2); border: 1px solid var(--ui-line); border-radius: 9px; color: var(--ui-text); display: flex; font-size: 12px; justify-content: center; min-height: 42px; padding: 0 12px; }
    .ui-button--accent { background: var(--ui-accent); border-color: var(--ui-accent); color: #1b0e09; font-weight: 800; }

    .workspace { display: grid; grid-template-rows: auto minmax(500px, 1fr) auto; min-width: 0; }
    .toolbar { align-items: center; background: rgba(12, 13, 16, 0.92); border-bottom: 1px solid var(--ui-line); display: flex; justify-content: space-between; min-height: 62px; padding: 0 24px; position: sticky; top: 0; z-index: 20; }
    .toolbar__title { display: flex; flex-direction: column; gap: 2px; }
    .toolbar__title strong { font-size: 13px; }
    .toolbar__title span { color: var(--ui-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .toolbar__status { align-items: center; background: rgba(83, 214, 155, 0.1); border: 1px solid rgba(83, 214, 155, 0.25); border-radius: 999px; color: var(--ui-green); display: flex; font-size: 11px; font-weight: 750; gap: 7px; padding: 7px 11px; }
    .toolbar__status::before { background: currentColor; border-radius: 50%; content: ""; height: 7px; width: 7px; }
    .toolbar__status.has-failure { background: rgba(255, 119, 119, 0.1); border-color: rgba(255, 119, 119, 0.25); color: var(--ui-red); }
    .stage { align-items: flex-start; background-color: #0f1115; background-image: radial-gradient(#2c3039 0.75px, transparent 0.75px); background-size: 16px 16px; display: flex; justify-content: center; min-height: 560px; overflow: auto; padding: 42px; position: relative; }
    .frame-shell { position: relative; transform-origin: top left; }
    .preview-frame { background: var(--canvas); box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48); color: var(--ink); container-name: preview; container-type: inline-size; min-height: 720px; overflow: hidden; transform-origin: top left; width: 1440px; }
    .preview-frame.show-grid::after { background-image: linear-gradient(rgba(232, 93, 42, 0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(232, 93, 42, 0.13) 1px, transparent 1px); background-size: 8px 8px; content: ""; inset: 0; pointer-events: none; position: absolute; z-index: 100; }
    .preview-frame[data-motion="off"] *, .preview-frame[data-motion="off"] *::before, .preview-frame[data-motion="off"] *::after { animation: none !important; transition: none !important; }
    .visual-surface { background: var(--canvas); min-height: 720px; overflow: hidden; position: relative; }

    .p-brand { align-items: center; color: var(--plum); display: inline-flex; font-family: Georgia, serif; font-size: calc(28px * var(--density)); font-weight: 700; gap: 10px; letter-spacing: -0.7px; }
    .p-mark { background: var(--primary); border-radius: calc(var(--radius) * .42); display: inline-block; height: 34px; overflow: hidden; position: relative; transform: rotate(-4deg); width: 42px; }
    .p-mark::after { border-left: 21px solid transparent; border-right: 21px solid transparent; border-top: 17px solid #ffb187; content: ""; height: 0; left: 0; position: absolute; top: 0; width: 0; }
    .p-icon { align-items: center; display: inline-flex; justify-content: center; }
    .p-icon svg { fill: none; height: 20px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; width: 20px; }

    .landing-preview { background: var(--canvas); min-height: 780px; }
    .landing-nav { align-items: center; display: flex; justify-content: space-between; margin: 0 auto; max-width: 1180px; min-height: calc(88px * var(--density)); padding: 0 24px; }
    .landing-links { display: flex; gap: 28px; }
    .landing-links span { color: var(--muted); font-size: 14px; font-weight: 650; }
    .landing-nav-button, .landing-cta { align-items: center; border: 0; cursor: default; display: inline-flex; justify-content: center; min-height: 46px; }
    .landing-nav-button { background: var(--plum); border-radius: 999px; color: white; font-size: 13px; font-weight: 750; padding: 0 18px; }
    .landing-hero { align-items: center; display: grid; gap: 70px; grid-template-columns: 1.02fr .98fr; margin: 0 auto; max-width: 1180px; min-height: 650px; padding: calc(42px * var(--density)) 24px 70px; }
    .landing-eyebrow { color: var(--primary-text); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    .landing-copy h1 { color: var(--ink); font-family: Georgia, serif; font-size: clamp(52px, 6vw, 82px); letter-spacing: -3.6px; line-height: .98; margin: 18px 0 25px; }
    .landing-copy h1 em { color: var(--primary); }
    .landing-copy p { color: var(--muted); font-size: 17px; line-height: 1.7; margin: 0 0 25px; max-width: 580px; }
    .landing-actions { display: flex; flex-wrap: wrap; gap: 11px; }
    .landing-cta { border-radius: calc(var(--radius) * .62); font-size: 13px; font-weight: 800; gap: 9px; padding: 0 18px; }
    .landing-cta--dark { background: var(--ink); color: white; }
    .landing-cta--light { background: white; border: 1px solid var(--border); color: var(--ink); }
    .phone-stage { align-items: center; display: flex; justify-content: center; min-height: 520px; position: relative; }
    .phone-stage::before { background: #f2cbb1; border-radius: 50%; content: ""; height: 440px; position: absolute; width: 440px; }
    .phone-mock { background: #171217; border: 7px solid #171217; border-radius: 40px; box-shadow: 0 24px 70px rgba(75, 35, 59, .2); padding: 8px; position: relative; transform: rotate(2deg); width: 278px; z-index: 2; }
    .phone-mock::before { background: #171217; border-radius: 999px; content: ""; height: 22px; left: 50%; position: absolute; top: 12px; transform: translateX(-50%); width: 80px; z-index: 4; }
    .phone-screen { background: var(--canvas); border-radius: 29px; min-height: 500px; padding: 44px 16px 18px; }
    .phone-head { align-items: center; display: flex; font-size: 10px; font-weight: 750; justify-content: space-between; margin-bottom: 13px; }
    .phone-avatar { align-items: center; background: var(--secondary-soft); border-radius: 50%; color: var(--secondary); display: flex; height: 27px; justify-content: center; width: 27px; }
    .invite-art { align-items: center; background: var(--plum); border-radius: calc(var(--radius) * .8); color: white; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 260px; padding: 20px; }
    .invite-art small { color: #f7cdb1; font-size: 7px; letter-spacing: 1.7px; }
    .invite-art strong { font-family: Georgia, serif; font-size: 38px; font-style: italic; line-height: 1.04; text-align: center; }
    .invite-art i { background: var(--primary); height: 2px; width: 44px; }
    .phone-stats { display: grid; gap: 7px; grid-template-columns: 1fr 1fr; margin: 10px 0; }
    .phone-stats div { background: white; border: 1px solid var(--border); border-radius: calc(var(--radius) * .48); display: flex; flex-direction: column; padding: 9px; }
    .phone-stats strong { font-family: Georgia, serif; font-size: 18px; }
    .phone-stats span { color: var(--muted); font-size: 8px; }
    .phone-action { background: var(--primary); border: 0; border-radius: 999px; color: var(--on-primary); font-size: 10px; font-weight: 800; min-height: 44px; width: 100%; }

    .mobile-preview { background: var(--canvas); margin: 0 auto; min-height: 820px; padding: calc(18px * var(--density)) 22px 96px; }
    .mobile-top { align-items: center; display: flex; justify-content: space-between; margin-bottom: 35px; }
    .mobile-top .p-brand { font-size: 25px; }
    .mobile-badge { align-items: center; background: var(--secondary-soft); border-radius: 999px; color: var(--secondary); display: flex; font-size: 10px; font-weight: 800; min-height: 44px; padding: 0 13px; }
    .mobile-kicker { color: var(--primary-text); font-size: 11px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
    .mobile-title { color: var(--ink); font-family: Georgia, serif; font-size: 42px; letter-spacing: -1.4px; line-height: 1.08; margin: 12px 0; }
    .mobile-lede { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
    .mobile-primary { align-items: center; background: var(--primary); border: 0; border-radius: 999px; color: var(--on-primary); display: inline-flex; font-weight: 800; justify-content: center; min-height: 48px; padding: 0 19px; }
    .mobile-invite { align-items: center; background: var(--plum); border-radius: var(--radius); color: white; display: flex; flex-direction: column; gap: 12px; justify-content: center; margin: 28px auto 30px; min-height: 315px; padding: 25px; transform: rotate(1.5deg); width: 88%; }
    .mobile-invite small { color: #f7cdb1; font-size: 8px; letter-spacing: 2px; }
    .mobile-invite strong { font-family: Georgia, serif; font-size: 47px; font-style: italic; line-height: 1.05; text-align: center; }
    .mobile-invite i { background: var(--primary); height: 2px; width: 54px; }
    .mobile-section-title { font-family: Georgia, serif; font-size: 26px; margin: 0 0 13px; }
    .mobile-step { align-items: center; background: white; border: 1px solid var(--border); border-radius: calc(var(--radius) * .7); display: grid; gap: 11px; grid-template-columns: 44px 28px 1fr; margin-bottom: 10px; min-height: 66px; padding: 10px 13px; }
    .mobile-step__icon { align-items: center; background: var(--secondary-soft); border-radius: 11px; color: var(--secondary); display: flex; height: 42px; justify-content: center; width: 42px; }
    .mobile-step small { color: var(--primary-text); font-size: 10px; font-weight: 900; }
    .mobile-step span:last-child { font-size: 13px; font-weight: 750; }
    .mobile-tabs { align-items: center; background: white; border-top: 1px solid var(--border); bottom: 0; display: flex; height: 70px; justify-content: space-around; left: 0; position: absolute; right: 0; }
    .mobile-tab { align-items: center; color: var(--muted); display: flex; flex-direction: column; font-size: 9px; gap: 4px; min-height: 44px; min-width: 54px; padding-top: 4px; }
    .mobile-tab.is-active { color: var(--primary-text); font-weight: 800; }

    .templates-preview { background: var(--canvas); min-height: 820px; padding: 18px 22px 90px; }
    .templates-title { font-family: Georgia, serif; font-size: 34px; letter-spacing: -1px; line-height: 1.1; margin: 28px 0 17px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .filter-pill { align-items: center; background: white; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); display: inline-flex; font-size: 11px; min-height: 44px; padding: 0 14px; }
    .filter-pill.is-active { background: var(--plum); border-color: var(--plum); color: white; font-weight: 800; }
    .template-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
    .template-card { background: white; border-radius: calc(var(--radius) * .7); box-shadow: 0 8px 25px rgba(75, 35, 59, .08); overflow: hidden; }
    .template-art { align-items: center; aspect-ratio: .78; color: white; display: flex; flex-direction: column; justify-content: center; position: relative; }
    .template-art strong { font-family: Georgia, serif; font-size: 50px; font-style: italic; }
    .template-art small { font-size: 7px; letter-spacing: 1.3px; position: absolute; top: 17px; }
    .template-reward { align-items: center; background: white; border-radius: 999px; bottom: 8px; color: var(--primary-text); display: flex; font-size: 8px; font-weight: 900; gap: 4px; min-height: 32px; padding: 0 9px; position: absolute; }
    .template-info { padding: 11px; }
    .template-info small { color: var(--primary-text); display: block; font-size: 9px; font-weight: 800; }
    .template-info strong { display: block; font-size: 13px; margin-top: 3px; }

    .reward-preview { align-items: center; background: rgba(36, 24, 36, .45); display: flex; justify-content: center; min-height: 820px; padding: 22px; }
    .reward-sheet { background: var(--canvas); border-radius: var(--radius); box-shadow: 0 30px 80px rgba(0, 0, 0, .28); padding: 26px 22px 22px; width: min(100%, 390px); }
    .reward-handle { background: var(--border); border-radius: 999px; height: 4px; margin: -14px auto 22px; width: 38px; }
    .reward-icon { align-items: center; background: #fff0e2; border-radius: 50%; color: var(--primary-text); display: flex; height: 62px; justify-content: center; width: 62px; }
    .reward-sheet h1 { font-family: Georgia, serif; font-size: 30px; line-height: 1.1; margin: 18px 0 10px; }
    .reward-sheet > p { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .reward-fact { align-items: center; background: white; border: 1px solid var(--border); border-radius: calc(var(--radius) * .58); display: grid; gap: 11px; grid-template-columns: 38px 1fr; margin: 10px 0; min-height: 62px; padding: 9px 12px; }
    .reward-fact .p-icon { background: var(--secondary-soft); border-radius: 10px; color: var(--secondary); height: 38px; width: 38px; }
    .reward-fact strong { display: block; font-size: 13px; }
    .reward-fact span { color: var(--muted); display: block; font-size: 11px; margin-top: 2px; }
    .reward-action { background: var(--primary); border: 0; border-radius: 999px; color: var(--on-primary); font-weight: 850; margin-top: 14px; min-height: 50px; width: 100%; }
    .reward-cancel { background: transparent; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; min-height: 46px; width: 100%; }

    .qa-panel { background: var(--ui-panel); border-top: 1px solid var(--ui-line); display: grid; gap: 18px; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); padding: 20px 24px; }
    .qa-panel.is-hidden { display: none; }
    .qa-header { align-items: center; display: flex; justify-content: space-between; margin-bottom: 12px; }
    .qa-header h2, .prompt-head h2 { font-size: 12px; letter-spacing: .2px; margin: 0; }
    .test-list { display: grid; gap: 7px; grid-template-columns: repeat(2, 1fr); }
    .test-result { align-items: center; background: var(--ui-panel-2); border: 1px solid var(--ui-line); border-radius: 9px; display: flex; font-size: 11px; gap: 8px; min-height: 38px; padding: 8px 10px; }
    .test-result::before { background: var(--ui-green); border-radius: 50%; content: ""; height: 7px; width: 7px; }
    .test-result.fail::before { background: var(--ui-red); }
    .test-result.warn::before { background: var(--ui-amber); }
    .matrix { color: var(--ui-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; margin-top: 10px; min-height: 14px; }
    .prompt-box { background: #0d0f13; border: 1px solid var(--ui-line); border-radius: 10px; color: #dfe3eb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.55; margin: 10px 0 0; min-height: 86px; padding: 12px; white-space: pre-wrap; }

    @container preview (max-width: 760px) {
      .landing-nav { min-height: 76px; padding: 0 16px; }
      .landing-links, .landing-nav-button { display: none; }
      .landing-hero { display: flex; flex-direction: column; gap: 15px; min-height: auto; padding: 55px 16px 70px; }
      .landing-copy h1 { font-size: clamp(48px, 13cqw, 68px); letter-spacing: -3px; }
      .landing-copy p { font-size: 16px; }
      .landing-actions { flex-direction: column; }
      .landing-cta { width: 100%; }
      .phone-stage { min-height: 570px; transform: scale(.88); width: 100%; }
      .phone-stage::before { height: 410px; width: 410px; }
    }

    @container preview (min-width: 620px) {
      .mobile-preview, .templates-preview { border-inline: 1px solid var(--border); max-width: 430px; }
      .reward-sheet { max-width: 390px; }
    }

    @media (max-width: 900px) {
      .app { display: block; }
      .sidebar { height: auto; position: relative; }
      .workspace { min-height: 800px; }
      .qa-panel { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Playground kontrolleri">
      <div class="ui-brand">
        <div class="ui-brand__mark">DV</div>
        <div><strong>Davetim Playground</strong><span>Visual system explorer</span></div>
      </div>

      <section class="control-group">
        <h2>Presetler</h2>
        <div class="presets" id="presets">
          <button class="preset" data-preset="landing" type="button">Landing · Desktop</button>
          <button class="preset" data-preset="mobile" type="button">Mobil · Ana sayfa</button>
          <button class="preset" data-preset="templates" type="button">Mobil · Şablonlar</button>
          <button class="preset" data-preset="reward" type="button">Ödüllü hak sheet</button>
          <button class="preset" data-preset="contrast" type="button">Yüksek kontrast</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Yüzey ve viewport</h2>
        <label class="field">
          <span class="field__label">Ekran</span>
          <span class="select-wrap"><select id="surfaceSelect">
            <option value="landing">Landing hero</option>
            <option value="mobile">Mobil ana sayfa</option>
            <option value="templates">Şablon grid</option>
            <option value="reward">Ödüllü reklam sheet</option>
          </select></span>
        </label>
        <label class="field">
          <span class="field__label"><span>Viewport genişliği</span><output class="field__value" id="viewportValue">1440px</output></span>
          <input id="viewportRange" max="1440" min="320" step="1" type="range" value="1440" />
        </label>
        <div class="device-row">
          <button class="device-button" data-width="375" type="button">375</button>
          <button class="device-button" data-width="768" type="button">768</button>
          <button class="device-button" data-width="1024" type="button">1024</button>
          <button class="device-button" data-width="1440" type="button">1440</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Görsel sistem</h2>
        <div class="color-grid">
          <label class="color-field"><span>Primary</span><input id="primaryColor" type="color" value="#e85d2a" /></label>
          <label class="color-field"><span>Plum</span><input id="plumColor" type="color" value="#3b183a" /></label>
        </div>
        <label class="field">
          <span class="field__label"><span>Köşe yarıçapı</span><output class="field__value" id="radiusValue">24px</output></span>
          <input id="radiusRange" max="36" min="8" step="1" type="range" value="24" />
        </label>
        <label class="field">
          <span class="field__label"><span>Yoğunluk</span><output class="field__value" id="densityValue">100%</output></span>
          <input id="densityRange" max="115" min="85" step="1" type="range" value="100" />
        </label>
        <label class="field">
          <span class="field__label">Motion karakteri</span>
          <span class="select-wrap"><select id="motionSelect">
            <option value="soft">Yumuşak ve kısa</option>
            <option value="expressive">Belirgin</option>
            <option value="off">Kapalı / reduced</option>
          </select></span>
        </label>
        <div class="switch-row"><span>8px grid göster</span><button aria-pressed="false" class="switch" id="gridToggle" type="button"></button></div>
        <div class="switch-row"><span>QA panelini göster</span><button aria-pressed="true" class="switch" id="qaToggle" type="button"></button></div>
      </section>

      <div class="sidebar-actions">
        <button class="ui-button" id="resetButton" type="button">Sıfırla</button>
        <button class="ui-button ui-button--accent" id="matrixButton" type="button">Viewport testi</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="toolbar">
        <div class="toolbar__title"><strong id="toolbarTitle">Landing hero</strong><span id="toolbarMeta">1440px · fit 100%</span></div>
        <div class="toolbar__status" id="toolbarStatus">Canlı kontroller geçti</div>
      </header>

      <section class="stage" id="stage" aria-label="Canlı ön izleme alanı">
        <div class="frame-shell" id="frameShell">
          <div class="preview-frame" data-motion="soft" id="previewFrame">
            <div class="visual-surface" id="visualSurface"></div>
          </div>
        </div>
      </section>

      <section class="qa-panel" id="qaPanel">
        <div>
          <div class="qa-header"><h2>Canlı görsel QA</h2><span class="field__value" id="testSummary">—</span></div>
          <div class="test-list" id="testList"></div>
          <div class="matrix" id="matrixResult">Viewport matrisi henüz çalıştırılmadı.</div>
        </div>
        <div>
          <div class="prompt-head"><h2>Uygulama promptu</h2></div>
          <div class="prompt-box" id="promptOutput"></div>
          <button class="ui-button" id="copyButton" style="margin-top:8px; width:100%" type="button">Promptu kopyala</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const DEFAULTS = {
      surface: 'landing',
      viewport: 1440,
      primary: '#e85d2a',
      plum: '#3b183a',
      radius: 24,
      density: 100,
      motion: 'soft',
      grid: false,
      qa: true,
    };

    const presets = {
      landing: { ...DEFAULTS },
      mobile: { ...DEFAULTS, surface: 'mobile', viewport: 390, radius: 26 },
      templates: { ...DEFAULTS, surface: 'templates', viewport: 390, radius: 18, density: 96 },
      reward: { ...DEFAULTS, surface: 'reward', viewport: 390, radius: 28, motion: 'off' },
      contrast: { ...DEFAULTS, viewport: 768, primary: '#cf4315', plum: '#271026', radius: 16, density: 95 },
    };

    const state = { ...DEFAULTS, scale: 1, activePreset: 'landing' };
    const $ = (id) => document.getElementById(id);

    const icons = {
      arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg>',
      grid: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',
      edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="m16.5 3.5 4 4L8 20l-5 1 1-5Z"/></svg>',
      send: '<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
      play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg>',
      shield: '<svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.7 3.1 7.8 7.5 9.5 4.4-1.7 7.5-4.8 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/></svg>',
      home: '<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
      mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',
      user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 3.8-6 8-6s6.8 2 8 6"/></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };

    function icon(name) {
      return `<span class="p-icon" aria-hidden="true">${icons[name]}</span>`;
    }

    function brand() {
      return '<span class="p-brand"><span class="p-mark" aria-hidden="true"></span><span>davetim</span></span>';
    }

    function landingMarkup() {
      return `<div class="landing-preview">
        <header class="landing-nav">${brand()}<nav class="landing-links"><span>Özellikler</span><span>Nasıl çalışır?</span><span>S.S.S.</span></nav><button class="landing-nav-button" data-touch>Uygulamayı indir</button></header>
        <section class="landing-hero">
          <div class="landing-copy"><div class="landing-eyebrow">Mobil uygulama yakında</div><h1>Özel günün için <em>unutulmaz</em> bir davet.</h1><p>Davetini tasarla, tek bağlantıyla paylaş ve katılım yanıtlarını cebinden takip et. Başlamak ücretsiz.</p><div class="landing-actions"><button class="landing-cta landing-cta--dark" data-touch>${icon('send')} App Store · Yakında</button><button class="landing-cta landing-cta--light" data-touch>${icon('play')} Google Play · Yakında</button></div></div>
          <div class="phone-stage"><div class="phone-mock"><div class="phone-screen"><div class="phone-head"><span>İyi günler, Ece</span><span class="phone-avatar">E</span></div><div class="invite-art"><small>BİRLİKTE KUTLAYALIM</small><strong>Ece<br>&amp; Mert</strong><i></i><small>12 EYLÜL 2026 · 19.30</small></div><div class="phone-stats"><div><strong>24</strong><span>Katılıyor</span></div><div><strong>7</strong><span>Bekliyor</span></div></div><button class="phone-action" data-touch>Davetimi görüntüle</button></div></div></div>
        </section>
      </div>`;
    }

    function mobileMarkup() {
      const steps = [
        ['grid', '01', 'Tarzına uygun şablonu seç'],
        ['edit', '02', 'Bilgileri ve görünümü düzenle'],
        ['send', '03', 'Davetini paylaş, yanıtları izle'],
      ].map(([name, number, label]) => `<div class="mobile-step"><span class="mobile-step__icon">${icon(name)}</span><small>${number}</small><span>${label}</span></div>`).join('');
      return `<div class="mobile-preview"><div class="mobile-top">${brand()}<span class="mobile-badge">Geliştirme modu</span></div><div class="mobile-kicker">Özel günün, senin tarzın</div><h1 class="mobile-title">Davetini birkaç dokunuşta hazırla.</h1><p class="mobile-lede">Tasarla, paylaş ve katılım yanıtlarını tek yerden takip et. Başlamak ücretsiz.</p><button class="mobile-primary" data-touch>Şablonları keşfet ${icon('arrow')}</button><div class="mobile-invite"><small>BİRLİKTE KUTLAYALIM</small><strong>Ece<br>&amp; Mert</strong><i></i><small>12 EYLÜL 2026 · 19.30</small></div><h2 class="mobile-section-title">Üç adımda yayında</h2>${steps}<nav class="mobile-tabs"><span class="mobile-tab is-active" data-touch>${icon('home')}Ana sayfa</span><span class="mobile-tab" data-touch>${icon('grid')}Şablonlar</span><span class="mobile-tab" data-touch>${icon('mail')}Davetlerim</span><span class="mobile-tab" data-touch>${icon('user')}Profil</span></nav></div>`;
    }

    function templatesMarkup() {
      const items = [
        ['#3b183a', 'Düğün', 'Gece Bahçesi', false],
        ['#d95d39', 'Doğum günü', 'Renkli Bir Yaş', false],
        ['#2442a5', 'Nişan', 'Modern Zarafet', true],
        ['#1e6a50', 'Mezuniyet', 'Yeni Başlangıç', true],
      ].map(([tone, category, title, locked]) => `<article class="template-card"><div class="template-art" style="background:${tone}"><small>${category.toUpperCase()}</small><strong>${title.slice(0, 1)}</strong>${locked ? `<span class="template-reward">${icon('play')} Reklamla aç</span>` : ''}</div><div class="template-info"><small>${category}</small><strong>${title}</strong></div></article>`).join('');
      return `<div class="templates-preview"><div class="mobile-top">${brand()}<span class="mobile-badge">4 şablon</span></div><div class="mobile-kicker">Koleksiyon</div><h1 class="templates-title">Hikâyene uyan tasarımı bul</h1><div class="filter-row"><span class="filter-pill is-active" data-touch>Tümü</span><span class="filter-pill" data-touch>Düğün</span><span class="filter-pill" data-touch>Doğum günü</span></div><div class="template-grid">${items}</div><nav class="mobile-tabs"><span class="mobile-tab" data-touch>${icon('home')}Ana sayfa</span><span class="mobile-tab is-active" data-touch>${icon('grid')}Şablonlar</span><span class="mobile-tab" data-touch>${icon('mail')}Davetlerim</span><span class="mobile-tab" data-touch>${icon('user')}Profil</span></nav></div>`;
    }

    function rewardMarkup() {
      return `<div class="reward-preview"><section class="reward-sheet" aria-label="Ödüllü reklam bilgilendirmesi"><div class="reward-handle"></div><div class="reward-icon">${icon('play')}</div><h1>Filigransız çıktıyı aç</h1><p>Bir reklamı tamamladığında bu davet için tek kullanımlık filigransız çıktı hakkı kazanırsın.</p><div class="reward-fact"><span class="p-icon">${icons.play}</span><div><strong>Ne yapacaksın?</strong><span>1 ödüllü reklam izle</span></div></div><div class="reward-fact"><span class="p-icon">${icons.check}</span><div><strong>Ne kazanacaksın?</strong><span>1 filigransız dışa aktarım</span></div></div><div class="reward-fact"><span class="p-icon">${icons.clock}</span><div><strong>Ne kadar geçerli?</strong><span>24 saat veya kullanılana kadar</span></div></div><button class="reward-action" data-touch>Reklamı izle ve hakkı aç</button><button class="reward-cancel" data-touch>Şimdi değil</button></section></div>`;
    }

    const surfaceNames = {
      landing: 'Landing hero',
      mobile: 'Mobil ana sayfa',
      templates: 'Şablon grid',
      reward: 'Ödüllü reklam sheet',
    };

    const markupBySurface = { landing: landingMarkup, mobile: mobileMarkup, templates: templatesMarkup, reward: rewardMarkup };

    function syncControls() {
      $('surfaceSelect').value = state.surface;
      $('viewportRange').value = state.viewport;
      $('viewportValue').textContent = `${state.viewport}px`;
      $('primaryColor').value = state.primary;
      $('plumColor').value = state.plum;
      $('radiusRange').value = state.radius;
      $('radiusValue').textContent = `${state.radius}px`;
      $('densityRange').value = state.density;
      $('densityValue').textContent = `${state.density}%`;
      $('motionSelect').value = state.motion;
      $('gridToggle').setAttribute('aria-pressed', String(state.grid));
      $('qaToggle').setAttribute('aria-pressed', String(state.qa));
      document.querySelectorAll('[data-width]').forEach((button) => button.classList.toggle('is-active', Number(button.dataset.width) === state.viewport));
      document.querySelectorAll('[data-preset]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.preset === state.activePreset)));
    }

    function applyTokens() {
      const frame = $('previewFrame');
      const primaryText = accessibleAccent(state.primary);
      const onPrimary = readableOn(state.primary);
      frame.style.setProperty('--primary', state.primary);
      frame.style.setProperty('--primary-text', primaryText);
      frame.style.setProperty('--on-primary', onPrimary);
      frame.style.setProperty('--plum', state.plum);
      frame.style.setProperty('--radius', `${state.radius}px`);
      frame.style.setProperty('--density', state.density / 100);
      frame.dataset.motion = state.motion;
      frame.classList.toggle('show-grid', state.grid);
      $('qaPanel').classList.toggle('is-hidden', !state.qa);
    }

    function fitPreview() {
      const stage = $('stage');
      const shell = $('frameShell');
      const frame = $('previewFrame');
      const available = Math.max(280, stage.clientWidth - 84);
      state.scale = Math.min(1, available / state.viewport);
      frame.style.width = `${state.viewport}px`;
      frame.style.transform = `scale(${state.scale})`;
      requestAnimationFrame(() => {
        shell.style.width = `${state.viewport * state.scale}px`;
        shell.style.height = `${Math.max(720, frame.scrollHeight) * state.scale}px`;
        $('toolbarMeta').textContent = `${state.viewport}px · fit ${Math.round(state.scale * 100)}%`;
      });
    }

    function renderPreview() {
      $('visualSurface').innerHTML = markupBySurface[state.surface]();
      $('toolbarTitle').textContent = surfaceNames[state.surface];
      applyTokens();
      fitPreview();
    }

    function hexToRgb(hex) {
      const value = hex.replace('#', '');
      return [0, 2, 4].map((index) => parseInt(value.slice(index, index + 2), 16));
    }

    function luminance(hex) {
      const channels = hexToRgb(hex).map((value) => {
        const normalized = value / 255;
        return normalized <= 0.03928 ? normalized / 12.92 : Math.pow((normalized + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
    }

    function contrast(foreground, background) {
      const a = luminance(foreground);
      const b = luminance(background);
      return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    }

    function rgbToHex(channels) {
      return `#${channels.map((value) => Math.round(value).toString(16).padStart(2, '0')).join('')}`;
    }

    function mix(foreground, background, amount) {
      const foregroundChannels = hexToRgb(foreground);
      const backgroundChannels = hexToRgb(background);
      return rgbToHex(foregroundChannels.map((value, index) => value * (1 - amount) + backgroundChannels[index] * amount));
    }

    function accessibleAccent(primary) {
      if (contrast(primary, '#fff8f1') >= 4.5) return primary;
      for (let amount = 0.05; amount <= 1; amount += 0.05) {
        const candidate = mix(primary, '#241824', amount);
        if (contrast(candidate, '#fff8f1') >= 4.5) return candidate;
      }
      return '#241824';
    }

    function readableOn(background) {
      return contrast('#241824', background) >= contrast('#ffffff', background) ? '#241824' : '#ffffff';
    }

    function getTestResults() {
      const surface = $('visualSurface');
      const touchTargets = [...surface.querySelectorAll('[data-touch]')];
      const minTouch = touchTargets.length ? Math.min(...touchTargets.map((node) => Math.min(node.getBoundingClientRect().width, node.getBoundingClientRect().height) / state.scale)) : 44;
      const overflow = surface.scrollWidth > surface.clientWidth + 1;
      const bodyContrast = contrast('#241824', '#fff8f1');
      const mutedContrast = contrast('#6e626c', '#fff8f1');
      const primaryTextContrast = contrast(accessibleAccent(state.primary), '#fff8f1');
      const ctaContrast = contrast(readableOn(state.primary), state.primary);
      return [
        { label: `Yatay taşma: ${overflow ? 'var' : 'yok'}`, pass: !overflow },
        { label: `En küçük dokunma hedefi: ${Math.round(minTouch)}px`, pass: minTouch >= 44 },
        { label: `Ana metin kontrastı: ${bodyContrast.toFixed(1)}:1`, pass: bodyContrast >= 4.5 },
        { label: `İkincil metin kontrastı: ${mutedContrast.toFixed(1)}:1`, pass: mutedContrast >= 4.5 },
        { label: `Aksan metni kontrastı: ${primaryTextContrast.toFixed(1)}:1`, pass: primaryTextContrast >= 4.5 },
        { label: `Primary CTA kontrastı: ${ctaContrast.toFixed(1)}:1`, pass: ctaContrast >= 4.5 },
        { label: state.motion === 'off' ? 'Motion: reduced uyumlu' : `Motion: ${state.motion === 'soft' ? 'kısa ve kontrollü' : 'belirgin'}`, pass: true, warn: state.motion === 'expressive' },
      ];
    }

    function renderTests() {
      const results = getTestResults();
      $('testList').innerHTML = results.map((result) => `<div class="test-result ${result.pass ? (result.warn ? 'warn' : '') : 'fail'}">${result.label}</div>`).join('');
      const failures = results.filter((result) => !result.pass).length;
      $('testSummary').textContent = failures ? `${failures} başarısız` : `${results.length}/${results.length} geçti`;
      $('toolbarStatus').textContent = failures ? `${failures} kontrol başarısız` : 'Canlı kontroller geçti';
      $('toolbarStatus').classList.toggle('has-failure', failures > 0);
      return failures === 0;
    }

    function updatePrompt() {
      const parts = [];
      if (state.surface !== DEFAULTS.surface) parts.push(`${surfaceNames[state.surface]} yüzeyine odaklan`);
      if (state.viewport !== DEFAULTS.viewport) parts.push(`${state.viewport}px viewport davranışını esas al`);
      if (state.primary !== DEFAULTS.primary) parts.push(`primary rengi ${state.primary} olarak değiştir`);
      if (state.plum !== DEFAULTS.plum) parts.push(`koyu davetiye rengini ${state.plum} olarak kullan`);
      if (state.radius !== DEFAULTS.radius) parts.push(state.radius < 18 ? 'köşeleri daha keskin ve editoryal yap' : `köşe yarıçapını yaklaşık ${state.radius}px tut`);
      if (state.density !== DEFAULTS.density) parts.push(state.density < 100 ? 'yerleşimi biraz daha kompaktlaştır' : 'yerleşime daha fazla nefes alanı ver');
      if (state.motion !== DEFAULTS.motion) parts.push(state.motion === 'off' ? 'hareketi kapat ve reduced-motion davranışını varsayılan yap' : 'giriş hareketlerini daha belirgin ama kısa tut');
      if (state.grid) parts.push('8px grid hizasını koru');
      const direction = parts.length ? parts.join('; ') : 'mevcut sıcak editoryal marka yönünü, turuncu aksanı ve erik tonlu davetiye imzasını koru';
      $('promptOutput').textContent = `Davetim landing ve mobil arayüzünü güncelle: ${direction}. Yatay taşma üretme, normal metinde en az 4.5:1 kontrast ve tüm dokunma hedeflerinde en az 44px boyut sağla. Framer Motion hareketlerini kısa, amaçlı ve prefers-reduced-motion uyumlu uygula.`;
    }

    function updateAll() {
      syncControls();
      renderPreview();
      updatePrompt();
      requestAnimationFrame(() => requestAnimationFrame(renderTests));
    }

    function setPreset(name) {
      Object.assign(state, presets[name], { activePreset: name });
      updateAll();
    }

    async function runViewportMatrix() {
      const original = { viewport: state.viewport, activePreset: state.activePreset };
      const widths = [375, 768, 1024, 1440];
      const outcomes = [];
      $('matrixButton').textContent = 'Test ediliyor…';
      $('matrixButton').disabled = true;
      for (const width of widths) {
        state.viewport = width;
        state.activePreset = '';
        syncControls();
        renderPreview();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        outcomes.push({ width, pass: getTestResults().every((result) => result.pass) });
      }
      state.viewport = original.viewport;
      state.activePreset = original.activePreset;
      updateAll();
      $('matrixResult').textContent = outcomes.map((item) => `${item.width}px ${item.pass ? 'PASS' : 'FAIL'}`).join('  ·  ');
      $('matrixButton').textContent = 'Viewport testi';
      $('matrixButton').disabled = false;
    }

    $('presets').addEventListener('click', (event) => {
      const button = event.target.closest('[data-preset]');
      if (button) setPreset(button.dataset.preset);
    });
    $('surfaceSelect').addEventListener('change', (event) => { state.surface = event.target.value; state.activePreset = ''; updateAll(); });
    $('viewportRange').addEventListener('input', (event) => { state.viewport = Number(event.target.value); state.activePreset = ''; updateAll(); });
    document.querySelectorAll('[data-width]').forEach((button) => button.addEventListener('click', () => { state.viewport = Number(button.dataset.width); state.activePreset = ''; updateAll(); }));
    $('primaryColor').addEventListener('input', (event) => { state.primary = event.target.value; state.activePreset = ''; updateAll(); });
    $('plumColor').addEventListener('input', (event) => { state.plum = event.target.value; state.activePreset = ''; updateAll(); });
    $('radiusRange').addEventListener('input', (event) => { state.radius = Number(event.target.value); state.activePreset = ''; updateAll(); });
    $('densityRange').addEventListener('input', (event) => { state.density = Number(event.target.value); state.activePreset = ''; updateAll(); });
    $('motionSelect').addEventListener('change', (event) => { state.motion = event.target.value; state.activePreset = ''; updateAll(); });
    $('gridToggle').addEventListener('click', () => { state.grid = !state.grid; state.activePreset = ''; updateAll(); });
    $('qaToggle').addEventListener('click', () => { state.qa = !state.qa; updateAll(); });
    $('resetButton').addEventListener('click', () => setPreset('landing'));
    $('matrixButton').addEventListener('click', runViewportMatrix);
    $('copyButton').addEventListener('click', async () => {
      const text = $('promptOutput').textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      $('copyButton').textContent = 'Kopyalandı!';
      setTimeout(() => { $('copyButton').textContent = 'Promptu kopyala'; }, 1200);
    });
    window.addEventListener('resize', () => { fitPreview(); requestAnimationFrame(renderTests); });

    updateAll();
  </script>
</body>
</html>
